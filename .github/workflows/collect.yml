name: Recolectar liquidaciones

on:
  schedule:
    # 6 oportunidades por hora: GitHub atrasa/descarta crons bajo carga;
    # el colector es idempotente (upsert), asi que redundancia = frescura
    - cron: '4 * * * *'
    - cron: '14 * * * *'
    - cron: '24 * * * *'
    - cron: '34 * * * *'
    - cron: '44 * * * *'
    - cron: '54 * * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Backfill inicial (~62 dias de horas + diario completo)'
        required: false
        default: 'false'
  # Disparo externo sin cron: comentario que contenga "collect-now" en cualquier issue
  issue_comment:
    types: [created]

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name != 'issue_comment' || contains(github.event.comment.body, 'collect-now')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recolectar
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then
            python scripts/collect.py --backfill
          else
            python scripts/collect.py
          fi
      - name: Commit datos si hay cambios
        run: |
          git config user.name "Davizz-dev13"
          git config user.email "Davizz-dev13@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Datos de liquidaciones: $(date -u +%Y-%m-%d\ %H:00) UTC"
          for i in 1 2 3; do
            # -X theirs: si dos corridas encoladas commitean datos a la vez, el
            # rebase conflicta en los JSON de una linea; gana el commit nuevo,
            # que es un refetch completo de las ultimas 36 h (upsert idempotente)
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 20
          done
          echo "No se pudo subir el commit de datos tras 3 intentos" >&2
          exit 1
